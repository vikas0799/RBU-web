<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>
    <style>
        main{
            background-color: aqua;
            display: flex;
            justify-content: space-between;
            height: 300px;
            align-items: flex-start;
        }
        div{
            background-color: antiquewhite;
            margin: 10px;
        }
        
    </style>
</head>
<body>
    <main>
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>

    </main>
</body>
</html>
