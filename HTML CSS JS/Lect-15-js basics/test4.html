    <script>
        function harsh(parth){
           parth();
           console.log("hello rbu");
           console.log(parth);
           parth();
           console.log(typeof(parth));
           parth();
           
        }
        let x=()=>{
            console.log("hi");
            console.log("bye");
        };
        harsh(x);
